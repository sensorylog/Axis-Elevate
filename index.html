<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AXIS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">AXIS</div>
    <nav class="top-nav">
      <button data-tab="today" class="active">Today</button>
      <button data-tab="train">Train</button>
      <button data-tab="food">Food</button>
      <button data-tab="move">Move</button>
      <button data-tab="progress">Progress</button>
    </nav>
    <button id="oracleToggle" class="icon-btn">Oracle</button>
  </header>

  <main class="app-main">
    <!-- TODAY -->
    <section id="today" class="tab active">
      <h1>Your Next Move</h1>
      <div id="nextMoveCard" class="card next-move">
        <div class="nm-type" id="nmType">—</div>
        <div class="nm-title" id="nmTitle">Loading…</div>
        <div class="nm-meta" id="nmMeta"></div>
        <button id="nmAction" class="primary-btn">Start</button>
      </div>

      <div class="grid">
        <div class="card">
          <h3>Readiness</h3>
          <div id="readinessValue">—</div>
        </div>
        <div class="card">
          <h3>Protein</h3>
          <div id="proteinValue">—</div>
        </div>
        <div class="card">
          <h3>Sleep</h3>
          <div id="sleepValue">—</div>
        </div>
        <div class="card">
          <h3>Steps</h3>
          <div id="stepsValue">—</div>
        </div>
      </div>
    </section>

    <!-- TRAIN -->
    <section id="train" class="tab">
      <h1>Train</h1>
      <div class="card">
        <h3>Today’s Session</h3>
        <div id="sessionInfo">No session generated yet.</div>
        <button id="generateSessionBtn" class="primary-btn">Generate Session</button>
      </div>
    </section>

    <!-- FOOD -->
    <section id="food" class="tab">
      <h1>Food</h1>
      <div class="card">
        <h3>Search</h3>
        <input id="foodQuery" type="text" placeholder="e.g. jollof rice, chicken, sushi" />
        <button id="foodSearchBtn" class="primary-btn">Search</button>
        <div id="foodResults" class="list"></div>
      </div>
      <div class="card">
        <h3>Barcode</h3>
        <input id="barcodeInput" type="text" placeholder="Enter barcode" />
        <button id="barcodeBtn" class="primary-btn">Lookup</button>
        <div id="barcodeResult" class="list"></div>
      </div>
    </section>

    <!-- MOVE -->
    <section id="move" class="tab">
      <h1>Move</h1>
      <div class="card">
        <h3>Walk</h3>
        <button id="startWalkBtn" class="primary-btn">Start Walk</button>
        <div id="walkStatus">Not started</div>
      </div>
    </section>

    <!-- PROGRESS -->
    <section id="progress" class="tab">
      <h1>Progress</h1>
      <div class="card">
        <h3>Summary</h3>
        <div id="progressSummary">No data yet.</div>
      </div>
    </section>
  </main>

  <!-- Oracle Panel -->
  <aside id="oraclePanel" class="oracle-panel hidden">
    <div class="oracle-header">
      <h2>Oracle</h2>
      <button id="closeOracle" class="icon-btn">✕</button>
    </div>
    <div id="oracleContent" class="oracle-content">
      Ask AXIS anything about your training, food, or progress.
    </div>
    <div class="oracle-input-row">
      <input id="oracleInput" type="text" placeholder="I’m exhausted today…" />
      <button id="oracleSend" class="primary-btn">Send</button>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
